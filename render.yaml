services:
  # ── Backend Web Service (Node.js / Express API) ──────────────────────────
  - type: web
    name: omnistudy-backend
    runtime: node
    plan: free
    rootDir: backend
    buildCommand: npm install && npm run build
    startCommand: npm start
    healthCheckPath: /
    envVars:
      - key: NODE_ENV
        value: production
      - key: MONGO_URI
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: GEMINI_API_KEY
        sync: false
      - key: TRANSLATION_SERVICE_URL
        value: http://localhost:8000

  # ── Frontend Static Site (React / Vite SPA) ──────────────────────────────
  - type: static
    name: omnistudy-frontend
    runtime: static
    plan: free
    rootDir: .
    buildCommand: npm install && npm run build
    publishDir: build
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        fromService:
          type: web
          name: omnistudy-backend
          envVarKey: RENDER_EXTERNAL_URL

